[project]
name = "formr-mcp"
version = "0.2.0"
description = "MCP server that exposes the formr v1 API to the formr admin assistant."
requires-python = ">=3.12"
dependencies = [
  "cryptography>=44",
  "httpx>=0.28",
  "mcp>=2.3,<3",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
formr-mcp = "formr_mcp.main:main"
formr-mcp-dev = "formr_mcp.main:dev"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["formr_mcp*"]
